[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coder-agent"
dynamic = ["version"]
description = "从零实现的 coding agent：读代码、改文件、跑命令、自己修 bug，带 Web 界面和评测框架"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
coder = "coder.__main__:main"
coder-web = "coder.web.__main__:main"
coder-eval = "coder.eval:main"

[tool.setuptools.dynamic]
version = { attr = "coder.__version__" }

[tool.setuptools.packages.find]
include = ["coder*"]

[tool.setuptools.package-data]
"coder.web" = ["static/*"]
"coder" = ["sandbox_image/Dockerfile"]

[tool.pytest.ini_options]
# evals/tasks 下的隐藏测试只在评测时、在 agent 的工作区里运行
testpaths = ["tests"]
